[project]
name = "agent-control-server"
version = "8.15.0"
description = "Server for Agent Control - manage and evaluate controls for AI agents"
requires-python = ">=3.12,<3.15"
# Note: agent-control-models, agent-control-engine, and agent-control-telemetry
#       are bundled at build time
# Note: agent-control-evaluators is a runtime dependency (NOT vendored) to avoid
#       duplicate module conflict when galileo extras are installed
dependencies = [
    "fastapi>=0.109.0",
    "prometheus-client>=0.20.0",
    "starlette-exporter>=0.23.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",  # For auth_framework HTTP providers
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "SQLAlchemy>=2.0.0",
    "psycopg>=3.1",
    "asyncpg>=0.29.0",
    "greenlet>=3.0",
    "alembic>=1.13.0",
    "jsonschema>=4.25.1",
    "jsonschema-rs>=0.22.0",
    "PyJWT>=2.8.0",
    "google-re2>=1.1",  # For engine (bundled)
    "agent-control-evaluators>=8.6.0",  # NOT vendored - avoid conflict with galileo
]
authors = [
    {name = "Agent Control Team"}
]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
galileo = ["agent-control-evaluator-galileo>=7.5.0"]
binary = ["psycopg[binary]>=3.1"]
