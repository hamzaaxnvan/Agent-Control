[project]
name = "agent-control-evaluator-galileo"
version = "8.15.0"
description = "Galileo evaluators (Luna, Decision Models, LLM-as-judge) for agent-control"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent Control Team" }]
dependencies = [
    "agent-control-evaluators>=8.6.0",
    "agent-control-models>=8.6.0",
    "galileo-core>=4.4.0,<5.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
dev = [
    "agent-control-sdk>=8.11.0",
    "agent-control-telemetry>=8.6.0",
    "agent-control-engine>=8.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
