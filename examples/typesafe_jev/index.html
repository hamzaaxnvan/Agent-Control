<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev Guardrail Playground</title>
<style>
  :root {
    --bg: #fbfbfa;
    --surface: #ffffff;
    --surface-2: #f4f4f2;
    --border: #e3e3df;
    --text: #1b1b19;
    --text-dim: #6d6d68;
    --accent: #3b5bdb;
    --ok: #2f9e44;
    --warn: #e8a317;
    --danger: #d9480f;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a;
      --surface: #1f1f23;
      --surface-2: #26262b;
      --border: #34343a;
      --text: #ececee;
      --text-dim: #9a9aa2;
      --accent: #748ffc;
      --ok: #51cf66;
      --warn: #ffd43b;
      --danger: #ff8787;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a; --surface: #1f1f23; --surface-2: #26262b; --border: #34343a;
    --text: #ececee; --text-dim: #9a9aa2; --accent: #748ffc;
    --ok: #51cf66; --warn: #ffd43b; --danger: #ff8787;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }

  header { margin-bottom: 24px; }
  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-dim); font-size: 13px; }
  .sub code { font-family: var(--mono); font-size: 12px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }

  textarea {
    width: 100%; min-height: 84px; resize: vertical; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font: inherit; line-height: 1.5;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .fld { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--text-dim); font-weight: 600; margin: 12px 0 5px; }
