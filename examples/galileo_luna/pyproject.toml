[project]
name = "agent-control-galileo-luna-example"
version = "0.1.0"
description = "Agent Control direct Galileo Luna evaluator example"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-control-engine",
    "agent-control-evaluators",
    "agent-control-models",
    "agent-control-telemetry",
    "agent-control-sdk",
    "agent-control-evaluator-galileo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

